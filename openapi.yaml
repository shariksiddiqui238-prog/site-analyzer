openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analyzer
    description: Website analysis operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /analyze:
    post:
      operationId: analyzeUrl
      tags: [analyzer]
      summary: Analyze a website URL
      description: Fetches the given URL and returns SEO and metadata analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "400":
          description: Bad request (invalid URL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Non-HTML page or analysis error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AnalyzeRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: The URL to analyze
    AnalysisResult:
      type: object
      required:
        - httpStatus
        - responseTime
        - h1Count
        - imagesMissingAlt
        - wordCount
      properties:
        httpStatus:
          type: integer
          description: HTTP status code returned by the URL
        responseTime:
          type: number
          description: Response time in milliseconds
        pageTitle:
          type: ["string", "null"]
          description: The page title extracted from the HTML
        metaDescription:
          type: ["string", "null"]
          description: The meta description extracted from the HTML
        h1Count:
          type: integer
          description: Number of H1 elements on the page
        imagesMissingAlt:
          type: integer
          description: Number of images missing alt text
        wordCount:
          type: integer
          description: Approximate word count of the page body text
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message
